<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimun-scale=1.0">
    <title>Polifonía de Venus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="src/favicon.ico">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>

<body>
    <model-viewer id="visor-ar" alt="Venus de Capua en estado original" src="assets/venus_1.glb" ar
        ar-modes="webxr quick-look scene-viewer " ar-placement="floor" ar-scale="fixed" ar-status="not-presenting"
        interaction-prompt="auto" shadow-intensity="1" camera-controls skybox-height="2m" disable-pan disable-zoom
        auto-rotate min-camera-orbit="auto 90deg auto" max-camera-orbit="auto 90deg auto" touch-action="none"
        bounds="tight">
        <div class="slider">
            <div class="slides">
                <button class="slide selected" onclick="switchModel(this, 'venus_1')">Original</button>
                <button class="slide" onclick="switchModel(this, 'venus_2')">Reconstrucción</button>
                <button class="slide" onclick="switchModel(this, 'venus_3')">Discordia</button>
                <button class="slide" onclick="switchModel(this, 'venus_4')">Amor y Guerra</button>
                <button class="slide" onclick="switchModel(this, 'venus_5')">Música</button>
            </div>
        </div>
        <button slot="ar-button" id="ar-button" class="btn">
            <svg class="ar-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" width="24" height="24"
                fill="currentColor">
                <path
                    d="M480-120 200-272v-240L80-576v240l280 152 120-65.5V-120Zm40 0 v-129.5l120 65.5 280-152v-240L840-512v240L520-120ZM480-520l276-150-276-150-276 150 276 150Zm0 80L200-590l280-152 280 152-280 150Z" />
            </svg>
            <span>Ver en Realidad Aumentada</span>
        </button>
    </model-viewer>

    <div id="info-overlay" class="hidden"></div>

    <div id="info-panel" class="hidden">
        <img src="src/cerrar.png" alt="Cerrar" id="close-panel">
        <div class="panel-header">
            <h2 id="panel-titulo"></h2>
        </div>
        <hr>
        <h4 id="panel-meta"></h4>
        <div id="panel-contenido"></div>
    </div>

    <a href="https://www2.fba.unlp.edu.ar/areamuseo/" target="_blank" id="logo-link">
        <img src="src/logo.png" alt="Logo">
    </a>

    <div id="info-button">
        <img src="src/informacion.png" alt="Info">
    </div>

    <script src="main.js"></script>
</body>

</html>
